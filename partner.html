<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2029">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="메뉴잇 파트너">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<title>메뉴잇 파트너</title>
<style>
/* 작업 지시서: 어두운 오늘 패널 + 절취선이 있는 작업 티켓. 주황은 '지금 할 일'에만. */
:root{
  --paper:#eef0ec; --card:#ffffff; --ink:#1b2029; --ink2:#454c58; --ink3:#868c95; --line:#dfe2dc; --line2:#eceee9;
  --brand:#f26b1d; --brand-soft:#fff0e6; --go:#157a52; --go-soft:#e2f3ea; --sky:#2563c9; --sky-soft:#e7effb;
  --amber:#a86400; --amber-soft:#fdf1d8; --alert:#c8302a; --alert-soft:#fbe9e7;
  --r:16px; --fs:16px;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:var(--fs);line-height:1.45;-webkit-text-size-adjust:100%;letter-spacing:-.01em}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:620px;margin:0 auto;padding:0 16px calc(100px + env(safe-area-inset-bottom))}

/* today band */
.band{background:var(--ink);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 0 22px;border-radius:0 0 26px 26px}
.band .in{max-width:620px;margin:0 auto;padding:0 16px}
.band .top{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--brand);display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex:none}
.band .who{min-width:0}.band .who b{display:block;font-size:1.02em}.band .who small{color:#a9afb8;font-size:.8em}
.band .rf{margin-left:auto;width:38px;height:38px;border-radius:12px;border:1px solid #3a414d;background:transparent;color:#fff;display:grid;place-items:center}
.today{margin-top:18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:end}
.today .big{font-size:3.4em;font-weight:800;line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.today .big small{font-size:.32em;font-weight:600;color:#a9afb8;margin-left:4px;letter-spacing:0}
.today .next{border-left:1px solid #3a414d;padding-left:14px;min-width:0}
.today .next span{display:block;font-size:.78em;color:#a9afb8}
.today .next b{display:block;font-size:1.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.today .next em{font-style:normal;color:var(--brand);font-weight:700}
.mini-stats{display:flex;gap:18px;margin-top:16px;font-size:.82em;color:#a9afb8;flex-wrap:wrap}
.mini-stats b{color:#fff;font-size:1.1em;margin-left:4px;font-variant-numeric:tabular-nums}

/* toolbar */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);padding:12px 0 10px;display:flex;gap:8px;align-items:center}
.seg{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;background:#e2e5e0;border-radius:12px;padding:4px}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;border-radius:9px;padding:7px 12px;font-size:.86em;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(20,25,35,.12)}
.fbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;height:40px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.88em;flex:none}
.fbtn .dot{min-width:18px;height:18px;border-radius:9px;background:var(--brand);color:#fff;font-size:.72em;display:grid;place-items:center;padding:0 5px}
.vtog{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 10px;font-size:.84em;color:var(--ink3)}
.vtog .sw{display:flex;background:#e2e5e0;border-radius:10px;padding:3px}
.vtog .sw button{border:0;background:none;padding:5px 10px;border-radius:8px;font-size:.92em;font-weight:600;color:var(--ink2)}
.vtog .sw button.on{background:var(--card);color:var(--ink)}
.active-f{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.active-f button{border:0;background:var(--ink);color:#fff;border-radius:99px;padding:5px 10px;font-size:.8em;font-weight:600;display:inline-flex;gap:6px;align-items:center}

.group-h{display:flex;align-items:baseline;gap:8px;margin:18px 4px 8px;font-size:.86em;font-weight:700;color:var(--ink2)}
.group-h.today{color:var(--brand)}.group-h.late{color:var(--alert)}
.group-h small{font-weight:600;color:var(--ink3)}

/* ticket */
.tk{background:var(--card);border-radius:var(--r);margin-bottom:12px;box-shadow:0 1px 0 rgba(20,25,35,.04),0 6px 18px -10px rgba(20,25,35,.18);overflow:hidden}
.tk-head{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:16px 16px 14px}
.tk-date{border-right:1px solid var(--line2);padding-right:12px;text-align:center}
.tk-date .d{font-size:1.25em;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.tk-date .w{font-size:.76em;color:var(--ink3);font-weight:600;margin-top:2px}
.tk-date .t{margin-top:6px;font-size:.82em;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}
.tk-date.none .d{font-size:1.05em;color:var(--brand);line-height:1.2}
.tk-title{min-width:0}
.tk-title .tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px}
.tag{font-size:.72em;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--line2);color:var(--ink2)}
.tag.p{background:var(--brand-soft);color:var(--brand)}
.tag.s-배정{background:var(--amber-soft);color:var(--amber)}.tag.s-일정확정{background:var(--sky-soft);color:var(--sky)}
.tag.s-완료{background:var(--go-soft);color:var(--go)}.tag.s-서명{background:var(--go);color:#fff}.tag.warn{background:var(--alert-soft);color:var(--alert)}
.tk-title h3{margin:0;font-size:1.12em;line-height:1.3;word-break:keep-all}
.tk-title .addr{font-size:.84em;color:var(--ink3);margin-top:3px;word-break:break-all}
.track{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:0 16px 14px}
.track i{height:4px;border-radius:2px;background:var(--line)}
.track i.done{background:var(--go)}.track i.now{background:var(--brand)}
.track-l{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:0 16px;margin-top:-10px;margin-bottom:12px;font-size:.7em;color:var(--ink3);font-weight:600}
.track-l span.now{color:var(--brand)}.track-l span.done{color:var(--go)}
.perf{position:relative;height:0;border-top:1.5px dashed var(--line);margin:0 14px}
.perf::before,.perf::after{content:"";position:absolute;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--paper)}
.perf::before{left:-23px}.perf::after{right:-23px}
.tk-body{padding:14px 16px 16px;display:grid;gap:10px}
.rows{display:grid;gap:6px;font-size:.88em}
.rows .r{display:grid;grid-template-columns:62px 1fr;gap:8px}.rows .k{color:var(--ink3)}.rows .v{min-width:0;word-break:break-all}
.note{border-radius:12px;padding:10px 12px;font-size:.86em;white-space:pre-wrap;word-break:break-all;background:#f6f7f4}
.note b{display:block;font-size:.8em;color:var(--ink3);margin-bottom:3px}
.note.env{background:#f1f5fb}.note.env b{color:var(--sky)}
.note.sp{background:#fff6e0}.note.sp b{color:var(--amber)}
.note.cx{background:var(--alert-soft)}.note.cx b{color:var(--alert)}
.fee{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line2)}
.fee span{font-size:.84em;color:var(--ink2)}.fee span small{display:block;color:var(--ink3);font-size:.92em;margin-top:2px}
.fee b{font-size:1.08em;font-variant-numeric:tabular-nums;white-space:nowrap}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.quick a,.quick button{border:1px solid var(--line2);background:#f8f9f6;border-radius:12px;padding:9px 2px 7px;display:grid;justify-items:center;gap:3px;font-size:.72em;font-weight:600;color:var(--ink2);text-decoration:none}
.quick .i{width:20px;height:20px}
.quick .call{color:var(--go)}
.when{display:grid;grid-template-columns:1fr 104px;gap:8px}
label{display:grid;gap:5px;font-size:.8em;color:var(--ink3);font-weight:600}
input,textarea{border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 12px;height:46px;font-size:16px;width:100%;color:var(--ink)}
textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical;line-height:1.5}
input:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(27,32,41,.08)}
.btn{border:0;border-radius:14px;height:52px;font-weight:700;font-size:1em;background:var(--ink);color:#fff;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.brand{background:var(--brand)}.btn.go{background:var(--go)}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line);height:44px;font-size:.9em}
.btn.danger{background:transparent;color:var(--alert);border:1px solid #efc4c0}
.btn.sm{height:42px;font-size:.9em;border-radius:12px}
.btn:disabled{opacity:.45}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.signed{display:flex;align-items:center;gap:8px;font-size:.88em;color:var(--go);font-weight:700}
.muted{font-size:.8em;color:var(--ink3)}
details.fold{border-top:1px solid var(--line2);padding-top:10px}
details.fold summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:.86em;color:var(--ink2);font-weight:600}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary .sp{margin-left:auto;color:var(--ink3);font-weight:500}
details.fold > div{margin-top:10px;display:grid;gap:8px}
.chk{display:flex;gap:10px;align-items:center;font-size:.88em;color:var(--ink2);padding:6px 2px}
.chk input{width:20px;height:20px;accent-color:var(--go)}
.chk.on{color:var(--ink3);text-decoration:line-through}
.empty{text-align:center;color:var(--ink3);padding:48px 20px;background:var(--card);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-size:1.05em;margin-bottom:4px}
.notice{background:var(--brand-soft);border-radius:14px;padding:12px 14px;font-size:.88em;margin-bottom:10px;color:#7a3a10}

/* table */
.tw{background:var(--card);border-radius:var(--r);overflow:hidden}
.tbl{width:100%;border-collapse:collapse;font-size:.84em}
.tbl th{text-align:left;color:var(--ink3);font-weight:600;padding:11px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:11px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
.tbl td small{display:block;color:var(--ink3)}
.tbl .n,.tbl th:nth-child(n+3){text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tfoot td{font-weight:800;border-bottom:0;background:#f6f7f4}
.tbl tbody tr{cursor:pointer}

/* stats / statements */
.h2{font-size:1.25em;font-weight:800;margin:20px 4px 12px;letter-spacing:-.02em}
.h2 small{font-size:.6em;color:var(--ink3);font-weight:600;margin-left:6px;letter-spacing:0}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi div{background:var(--card);border-radius:var(--r);padding:14px 16px}
.kpi span{font-size:.78em;color:var(--ink3);font-weight:600}
.kpi b{display:block;font-size:1.6em;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .hero{grid-column:1/-1;background:var(--ink);color:#fff}
.kpi .hero span{color:#a9afb8}.kpi .hero b{font-size:2.2em}
.list{background:var(--card);border-radius:var(--r);overflow:hidden}
.list > div{display:flex;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line2);font-size:.9em}
.list > div:last-child{border-bottom:0}
.list b{font-variant-numeric:tabular-nums;white-space:nowrap}
.list small{display:block;color:var(--ink3);font-size:.88em}
.meter{height:6px;background:var(--line2);border-radius:3px;overflow:hidden;margin-top:7px}.meter i{display:block;height:100%;background:var(--brand)}
.stmt{background:var(--card);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.stmt-h{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px}
.stmt-h b{font-size:1.1em}
.badge{font-size:.74em;font-weight:700;border-radius:99px;padding:4px 10px}
.b-확인요청{background:var(--brand);color:#fff}.b-파트너확인{background:var(--go-soft);color:var(--go)}.b-이의제기{background:var(--alert-soft);color:var(--alert)}
.b-기안완료{background:var(--sky-soft);color:var(--sky)}.b-지급완료{background:var(--go);color:#fff}
.stmt-net{padding:4px 16px 14px}.stmt-net span{font-size:.8em;color:var(--ink3)}.stmt-net b{display:block;font-size:2em;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stmt .list{border-radius:0;border-top:1px dashed var(--line)}
.stmt-act{padding:14px 16px;display:grid;gap:8px;border-top:1px solid var(--line2)}
.fee-tbl .cat{font-size:.78em;color:var(--ink3);font-weight:700;padding:14px 16px 6px;background:#f6f7f4;display:block}

/* settings */
.set{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;display:grid;gap:12px}
.set h3{margin:0;font-size:1em}
.set .hint{font-size:.8em;color:var(--ink3);margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-size:.86em;font-weight:600;color:var(--ink2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.vars{font-size:.76em;color:var(--ink3);line-height:1.6}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{display:flex;max-width:620px;margin:0 auto}
nav.tabs button{flex:1;border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 0;color:var(--ink3);font-size:.68em;font-weight:700;position:relative}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on svg{stroke:var(--brand)}
nav.tabs .n{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--brand);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}

/* login */
.login{min-height:100vh;display:grid;align-content:center;padding:24px 16px;background:var(--ink)}
.login form{width:100%;max-width:380px;margin:0 auto;display:grid;gap:14px}
.login h1{margin:14px 0 0;font-size:1.7em;color:#fff;letter-spacing:-.03em}.login p{margin:0;color:#a9afb8;font-size:.9em}
.login label{color:#a9afb8}.login input{background:#262c37;border-color:#3a414d;color:#fff}
.err{color:#ff9a8f;font-size:.88em;min-height:20px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,18,24,.5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;z-index:41;background:var(--paper);border-radius:22px 22px 0 0;display:flex;flex-direction:column;max-width:620px;margin:0 auto}
.sheet::before{content:"";width:40px;height:4px;border-radius:2px;background:#c9ccc6;margin:8px auto 0}
.sh-head{display:flex;align-items:center;gap:10px;padding:10px 16px 10px}
.sh-head h3{margin:0;font-size:1.1em;flex:1;min-width:0}
.x{width:36px;height:36px;border-radius:12px;border:0;background:#e2e5e0;display:grid;place-items:center}
.sh-body{overflow:auto;padding:4px 16px calc(20px + env(safe-area-inset-bottom));display:grid;gap:12px}
.fsec{display:grid;gap:8px}.fsec > b{font-size:.8em;color:var(--ink3)}
.doc{background:#fff;border-radius:14px;padding:16px;display:grid;gap:10px}
.doc .hd{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.doc dl{margin:0;display:grid;grid-template-columns:70px 1fr;gap:6px 10px;font-size:.88em}.doc dt{color:var(--ink3)}.doc dd{margin:0;white-space:pre-wrap;word-break:break-all}
.pad-wrap{position:relative}
canvas.pad{display:block;width:100%;height:210px;border:1.5px dashed #b9bdb5;border-radius:14px;background:#fff;touch-action:none}
.pad-hint{position:absolute;inset:0;display:grid;place-items:center;color:#a5aaa2;pointer-events:none;font-size:.9em}
.msgbox{min-height:200px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-size:.88em;z-index:60;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.bad{background:var(--alert)}
.foot{font-size:.76em;color:var(--ink3);text-align:center;margin-top:14px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>

async function rpc(fn, args) {

}

function rangeOf(f) {

const RANGES = { db: [["all", "전체"], ["today", "오늘"], ["tomorrow", "내일"], ["week", "이번 주"], ["month", "이번 달"], ["custom", "기간"]],

function applyF(list, key, dateOf) {
  const f = S.f[key], [a, b] = rangeOf(f), q = f.q.trim().toLowerCase(), t = today();
  return list.filter((j) => {
    const d = dateOf(j);
    if (a || b) { if (!d) { if (key !== "db") return false; } else { if (a && d < a) return false; if (b && d > b) return false; } }
    if (f.part && j.part !== f.part) return false;
    if (f.store && j.store_name !== f.store) return false;
    if (f.status === "배정" && j.status !== "배정") return false;
    if (f.status === "일정확정" && j.status !== "일정확정") return false;
    if (f.status === "late" && !(j.visit_date && j.visit_date < t)) return false;
    if (f.status === "unsigned" && j.signed) return false;

    return true;
  });
}

/* ───── data ───── */
function authFail() { S.token = ""; store.set(TK, ""); renderLogin("다시 로그인해 주세요."); }
async function load(first) {
  if (S.busy) return; S.busy = true;
  try {
    const [r, f, st, pr] = await Promise.all([rpc("partner_jobs", { p_token: S.token }), rpc("partner_fees", { p_token: S.token }), rpc("partner_settlements", { p_token: S.token }), rpc("partner_settings_get", { p_token: S.token })]);
    if (!r || !r.ok) return authFail();
    S.me = r.me; S.jobs = r.jobs || []; S.fees = (f && f.fees) || []; S.setl = (st && st.items) || []; S.prof = pr && pr.ok ? pr : null; S.loadedAt = Date.now();
    if (S.prof && S.prof.ui) { UI = S.prof.ui || {}; store.set(UIK, JSON.stringify(UI)); }
    if (first && !store.get(FK) && S.prof?.settings?.dbRange) S.f.db.range = S.prof.settings.dbRange;
    applyFont(); render();
  } catch { if (first && !S.me) renderLogin("연결이 원활하지 않아요."); else toast("새로고침에 실패했어요. 연결을 확인해 주세요.", true); }
  finally { S.busy = false; }
}
function applyFont() { const fs = Number(S.prof?.settings?.fontSize) || 16; document.documentElement.style.setProperty("--fs", fs + "px"); }
async function save(job, patch, okMsg) {
  const d = { visit_date: job.visit_date, visit_time: job.visit_time, status: job.status, partner_note: job.partner_note, ...patch };
  try {
    const r = await rpc("partner_update_job", { p_token: S.token, p_job: job.id, p_visit_date: d.visit_date || null, p_visit_time: d.visit_time || "", p_status: d.status, p_note: d.partner_note || "" });
    if (!r || !r.ok) { if (r && r.error === "auth") return authFail(); toast(r && r.error === "locked" ? "서명이 끝났거나 정산이 마감돼 되돌릴 수 없어요." : r && r.error === "need_date" ? "방문 날짜를 먼저 저장해 주세요." : "저장하지 못했어요.", true); return false; }
    delete S.edits[job.id]; toast(okMsg); await load(); return true;
  } catch { toast("저장하지 못했어요. 연결을 확인해 주세요.", true); return false; }
}

function fill(tpl, j) {

let PAD = null;
function setupPad() {
  const c = $("#pad"), ctx = c.getContext("2d"), hint = $("#padHint"); let drawing = false, last = null;
  PAD = { dirty: false, clear() { const r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; c.width = r.width * dpr; c.height = r.height * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineWidth = 2.6; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#111"; ctx.fillStyle = "#111"; this.dirty = false; hint.style.display = ""; }, c };
  PAD.clear();
  const pt = (e) => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  c.addEventListener("pointerdown", (e) => { drawing = true; last = pt(e); c.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last[0], last[1], 1.2, 0, Math.PI * 2); ctx.fill(); PAD.dirty = true; hint.style.display = "none"; });
  c.addEventListener("pointermove", (e) => { if (!drawing) return; const p = pt(e); ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; });
  const end = () => { drawing = false; }; c.addEventListener("pointerup", end); c.addEventListener("pointercancel", end);
}
async function submitSign(j, btn) {

  if (j.status !== "완료") { err.textContent = "작업 완료를 먼저 눌러 주세요."; return; }
  if (!nm) { err.textContent = "확인자 성함을 입력해 주세요."; return; }
  if (!PAD || !PAD.dirty) { err.textContent = "서명란에 서명해 주세요."; return; }
  const c = PAD.c, out = document.createElement("canvas"), w = 600, hh = Math.round(600 * c.height / c.width); out.width = w; out.height = hh;
  const o = out.getContext("2d"); o.fillStyle = "#fff"; o.fillRect(0, 0, w, hh); o.drawImage(c, 0, 0, w, hh);
  btn.disabled = true; btn.textContent = "저장 중…";
  try {
    const r = await rpc("sign_submit", { p_sign: j.sign_token, p_name: nm, p_image: out.toDataURL("image/png") });
    if (r && (r.ok || r.error === "already")) { closeSheet(); toast(`${DOC[j.part] || "확인서"} 서명을 받았어요.`); await load(); const nj = S.jobs.find((x) => x.id === j.id); if (nj) openMsg(nj, "customer_done"); return; }

  return `<div class="tw"><table class="tbl"><thead><tr><th>날짜</th><th>매장</th><th>금액</th><th>추가</th><th>합계</th></tr></thead><tbody>
    ${rows.map((j) => `<tr data-jump="${h(j.id)}"><td class="num">${dateOf(j) ? md(dateOf(j)) : "미정"}${j.visit_time ? `<small>${h(j.visit_time)}</small>` : ""}</td><td><b>${h(j.store_name)}</b><small>${h(j.work_type || j.part)}${j.signed ? " · 서명" : ""}</small></td>
      <td class="n">${(j.base_fee || 0).toLocaleString()}</td><td class="n">${j.extra_fee ? j.extra_fee.toLocaleString() : j.extra_claim ? `<small>요청 ${j.extra_claim.toLocaleString()}</small>` : "-"}</td><td class="n"><b>${feeOf(j).toLocaleString()}</b></td></tr>`).join("")}
    </tbody><tfoot><tr><td colspan="2">합계 ${rows.length}건</td><td class="n">${tb.toLocaleString()}</td><td class="n">${te.toLocaleString()}</td><td class="n">${(tb + te).toLocaleString()}</td></tr></tfoot></table></div>`;
}
const vtog = (n) => `<div class="vtog"><span>${n}건</span><div class="sw"><button class="${S.f.view !== "table" ? "on" : ""}" data-act="view" data-v="card">티켓</button><button class="${S.f.view === "table" ? "on" : ""}" data-act="view" data-v="table">금액 표</button></div></div>`;
function band() {
  const t = today(), m = t.slice(0, 7), todays = S.jobs.filter((j) => j.status !== "완료" && j.visit_date === t).sort((a, b) => String(a.visit_time).localeCompare(String(b.visit_time)));
  const next = todays[0] || S.jobs.filter((j) => j.status === "일정확정" && j.visit_date > t).sort((a, b) => a.visit_date.localeCompare(b.visit_date))[0];
  const monthFee = S.jobs.filter((j) => j.status === "완료" && doneDate(j).startsWith(m)).reduce((a, j) => a + feeOf(j), 0);
  const undated = S.jobs.filter((j) => j.status === "배정").length, unsigned = S.jobs.filter((j) => j.status === "완료" && !j.signed).length;
  return `<section class="band"><div class="in">
    <div class="top"><div class="logo">M</div><div class="who"><b>${h(S.me?.name || "")} 님</b><small>${h((S.me?.parts || []).join(" · "))} 파트너</small></div><button class="rf" data-act="reload" aria-label="새로고침">${ic("refresh")}</button></div>
    <div class="today"><div class="big num">${todays.length}<small>${h(PL("band.today"))}</small></div>
      <div class="next">${next ? `<span>${next.visit_date === t ? h(PL("band.next")) : dlabel(next.visit_date)}</span><b><em>${h(next.visit_time || "시간 미정")}</em> ${h(next.store_name)}</b>` : `<span>오늘 방문</span><b>예정된 방문이 없어요</b>`}</div></div>
    <div class="mini-stats"><span>날짜 미정<b>${undated}</b></span><span>서명 대기<b>${unsigned}</b></span><span>${Number(m.slice(5))}월 수수료<b>${won(monthFee)}</b></span></div>
  </div></section>`;
}
function viewDB() {
  const t = today(), todo = S.jobs.filter((j) => j.status !== "완료"), list = applyF(todo, "db", (j) => j.visit_date || j.requested_date || "");
  let out = toolbar("db");
  if (!todo.length) return out + `<div class="empty"><b>배정된 일정이 없어요</b>새 매장이 배정되면 여기에 나타나요.</div>`;
  if (!list.length) return out + `<div class="empty"><b>조건에 맞는 건이 없어요</b>기간이나 필터를 바꿔 보세요.</div>`;
  out += vtog(list.length);
  if (S.f.view === "table") return out + tableView(list, (j) => j.visit_date || "");
